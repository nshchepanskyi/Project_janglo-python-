{% load tr_tags %}{% load static %}<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="{{ theme }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrandStay — {% tr "Login" %}</title><link rel="stylesheet" href="{% static 'hotel/style.css' %}"></head>
<body class="auth-page">
<div class="auth-card">
  <h1>GrandStay {% tr "Login" %}</h1>
  {% if messages %}{% for m in messages %}<div class="msg {{ m.tags }}">{% tr m %}</div>{% endfor %}{% endif %}
  <form method="post">{% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <input name="login" placeholder="{% tr "Username or Email" %}" required>
    <input name="password" type="password" placeholder="{% tr "Password" %}" required>
    <button class="btn primary" type="submit">{% tr "Login" %}</button>
  </form>
  <div class="auth-actions">
    <a class="btn ghost" href="{% url 'home' %}">{% tr "Home" %}</a>
    <a class="btn primary" href="{% url 'register' %}">{% tr "Create account" %}</a>
    <a class="btn ghost" href="{% url 'toggle_lang' %}">{{ lang|upper }}</a>
  </div>
</div>
</body>
</html>
