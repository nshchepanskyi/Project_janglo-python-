# Render Blueprint: створює Web Service із цього файлу
# (Dashboard → New → Blueprint → підключити репозиторій).
services:
  - type: web
    name: grandstay
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Потрібна версія Python (Django 6.1 + psycopg2-wheelʼи)
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DEBUG
        value: "False"
      # Генерується Render-ом один раз при створенні Blueprint
      - key: SECRET_KEY
        generateValue: true
      # HTTPS за зовнішнім проксі Render → Django бачить https
      - key: TRUST_X_FORWARDED_PROTO
        value: "true"
      # Render PostgreSQL: вставити Internal Database URL у Dashboard → Environment
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DATABASE_URL
        sync: false        # Internal Database URL із Render Postgres
      # Початковий адмін; прибрати ці секрети з Render після першого успішного deploy
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Опційно: повна перевірка TLS (файл CA має лежати в корені репо)
      # - key: DB_SSL_CA_URL
      #   sync: false        # URL CA-сертифіката TiDB Cloud
      # - key: DB_SSL_CA
      #   value: tidb-ca.pem
